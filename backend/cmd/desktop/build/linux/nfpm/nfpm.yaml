# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "Hephaestus"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Hephaestus desktop client"
vendor: "Hephaestus"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/Hephaestus"
    dst: "/usr/local/bin/Hephaestus"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/Hephaestus.png"
  - src: "./build/linux/Hephaestus.desktop"
    dst: "/usr/share/applications/Hephaestus.desktop"

# Default dependencies for GTK 4.10+ / WebKitGTK 6.0 (Ubuntu 24.04+, Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libpcap0.8

# Distribution-specific overrides for different package formats and WebKit versions
overrides:
  # RPM packages for RHEL/CentOS/AlmaLinux/Rocky Linux (GTK4 + WebKitGTK 6.0)
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - libpcap
  
  # Arch Linux packages (GTK4 + WebKitGTK 6.0)
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - libpcap

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

