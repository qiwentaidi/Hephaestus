name: docker-release
on:
  push:
    tags: ["v*", "docker-v*"]

permissions:
  contents: read

concurrency:
  group: hephaestus-docker-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/qiwentaidi/hephaestus

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-time: ${{ steps.version.outputs.build-time }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Web version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#docker-}"
          if [[ "$RELEASE_TAG" =~ ^docker-(v[0-9]+\.[0-9]+\.[0-9]+)-r[1-9][0-9]*$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]
          grep -Fx "const Version = \"$VERSION\"" backend/pkg/version/version.go
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build-time=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

  build:
    name: Build linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_TIME=${{ needs.prepare.outputs.build-time }}
            GOPROXY=https://proxy.golang.org|direct
          cache-from: type=gha,scope=hephaestus-docker-${{ matrix.arch }}
          cache-to: type=gha,scope=hephaestus-docker-${{ matrix.arch }},mode=max
      - name: Save image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish version and latest tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TIME: ${{ needs.prepare.outputs.build-time }}
        run: |
          AMD64=$(cat "$RUNNER_TEMP/digests/amd64")
          ARM64=$(cat "$RUNNER_TEMP/digests/arm64")
          [[ "$AMD64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.created=$BUILD_TIME" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"

          for tag in "$VERSION" latest; do
            docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' |
              jq -e --arg version "$VERSION" '
                .annotations["org.opencontainers.image.version"] == $version and
                ([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]
              '
          done
